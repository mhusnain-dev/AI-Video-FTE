version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: fte-postgres-prod
    environment:
      POSTGRES_DB: ai_video_fte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_video_fte"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fte-network
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: fte-redis-prod
    command: redis-server --requirepass "${REDIS_PASSWORD_FILE:-}" --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - fte-network
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_API_ADDR: https://vault:8200
      VAULT_CLUSTER_ADDR: https://vault:8201
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - ./config/vault-tls:/vault/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "vault status -tls-skip-verify | grep -q 'Sealed[[:space:]]*false'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fte-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      CONFIG_DIR: /app/config
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_video_fte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN_FILE: /run/secrets/vault_token
      VAULT_TRANSIT_KEY: biometric-encryption
      ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_key
      VEO_API_KEY_FILE: /run/secrets/veo_key
      RUNWAY_API_KEY_FILE: /run/secrets/runway_key
      LUMA_API_KEY_FILE: /run/secrets/luma_key
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL}
      ARCHIVE_BACKEND: ${ARCHIVE_BACKEND:-s3}
      ARCHIVE_BUCKET: ${ARCHIVE_BUCKET}
      ARCHIVE_LOCAL_PATH: ${ARCHIVE_LOCAL_PATH:-/data/archive}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - fte-network
    secrets:
      - postgres_password
      - redis_password
      - vault_token
      - elevenlabs_key
      - veo_key
      - runway_key
      - luma_key
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: nginx:alpine
    container_name: fte-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-tls:/etc/nginx/tls:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
      - frontend
    networks:
      - fte-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      VITE_API_URL: https://api.example.com
    networks:
      - fte-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: fte-prometheus-prod
    volumes:
      - ./config/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - fte-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'

  grafana:
    image: grafana/grafana:10.4.2
    container_name: fte-grafana-prod
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - fte-network
    secrets:
      - grafana_password
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fte-alertmanager-prod
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - fte-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

volumes:
  postgres_data:
  redis_data:
  vault_data:
  vault_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  fte-network:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  vault_token:
    file: ./secrets/vault_token.txt
  elevenlabs_key:
    file: ./secrets/elevenlabs_key.txt
  veo_key:
    file: ./secrets/veo_key.txt
  runway_key:
    file: ./secrets/runway_key.txt
  luma_key:
    file: ./secrets/luma_key.txt
  grafana_password:
    file: ./secrets/grafana_password.txt