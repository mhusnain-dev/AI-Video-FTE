# ============================================================
# Components
# ============================================================
components:
  parameters:
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ServiceName:
      name: service
      in: path
      required: true
      schema:
        type: string
        enum: [ingestion, router, admission, dispatch, facelock, merger]

  schemas:
    StoryStatus:
      type: string
      enum:
        - draft
        - planning
        - awaiting_approval
        - approved
        - in_progress
        - generating
        - pending_merge
        - merging
        - completed
        - failed
        - cancelled
        - paused_cost
        - paused_rate_limit
        - paused_sacred_guard

    ShotStatus:
      type: string
      enum:
        - planned
        - awaiting_approval
        - approved
        - in_admission
        - admission_passed
        - dispatched
        - generating
        - completed
        - failed
        - timeout
        - regenerating

    CreateStoryRequest:
      type: object
      required: [brief, userId]
      properties:
        brief:
          type: object
          required: [narrative, targetDurationSeconds]
          properties:
            narrative:
              type: string
              minLength: 1
            targetDurationSeconds:
              type: integer
              minimum: 1
              maximum: 3600
            aspectRatio:
              type: string
              enum: ['16:9', '9:16', '1:1', '4:5']
            resolution:
              type: string
              enum: [720p, 1080p, 4K]
            characterReferences:
              type: array
              items:
                type: string
            styleReferences:
              type: array
              items:
                type: string
            negativePrompts:
              type: array
              items:
                type: string
            audioConfig:
              $ref: '#/components/schemas/AudioConfig'
        userId:
          type: string
          format: uuid

    AudioConfig:
      type: object
      properties:
        ttsVoice:
          type: string
        ttsStyle:
          type: string
        musicSource:
          type: string
          enum: [royalty_free, elevenlabs, custom]
        musicTrackId:
          type: string
        musicVolume:
          type: number
          minimum: 0
          maximum: 1

    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        brief:
          $ref: '#/components/schemas/CreateStoryRequest/properties/brief'
        status:
          $ref: '#/components/schemas/StoryStatus'
        shots:
          type: array
          items:
            $ref: '#/components/schemas/Shot'
        currentVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalEstimatedCost:
          type: number
        totalActualCost:
          type: number

    Shot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        orderIndex:
          type: integer
        visualDescription:
          type: string
        durationSeconds:
          type: number
        cameraMotion:
          type: string
        characterNames:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ShotStatus'
        selectedModelId:
          type: string
        estimatedCostUsd:
          type: number
        actualCostUsd:
          type: number
        errorMessage:
          type: string

    CharacterUpload:
      type: object
      required: [name, imageBase64]
      properties:
        name:
          type: string
          minLength: 1
        imageBase64:
          type: string
          minLength: 1
        voiceReferenceBase64:
          type: string

    ShotPlanRevision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [add, remove, reorder, edit]
        shotId:
          type: string
          format: uuid
        newOrder:
          type: integer
          minimum: 0
        shotData:
          type: object

    TransitionConfig:
      type: object
      properties:
        type:
          type: string
          enum: [crossfade, fade, slide, zoom, wipe, custom]
        durationSeconds:
          type: number
        ffmpegFilter:
          type: string

    AdmissionContext:
      type: object
      required: [storyId, shotId, userId, prompt, referenceImages, modelId, estimatedCost]
      properties:
        storyId:
          type: string
          format: uuid
        shotId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        prompt:
          type: string
        referenceImages:
          type: array
          items:
            type: string
        modelId:
          type: string
        estimatedCost:
          type: number
          minimum: 0

    AdmissionResult:
      type: object
      properties:
        passed:
          type: boolean
        moderation:
          $ref: '#/components/schemas/GateResult'
        sacredGuard:
          $ref: '#/components/schemas/GateResult'
        costGuard:
          $ref: '#/components/schemas/GateResult'
        rateLimit:
          $ref: '#/components/schemas/GateResult'

    GateResult:
      type: object
      properties:
        passed:
          type: boolean
        reason:
          type: string
        score:
          type: number
        threshold:
          type: number
        matchType:
          type: string
          enum: [exact, fuzzy, visual]

    WebhookPayload:
      type: object
      required: [provider, requestId, status, timestamp, signature]
      properties:
        provider:
          type: string
        requestId:
          type: string
        status:
          type: string
          enum: [completed, failed]
        result:
          type: object
        error:
          type: string
        timestamp:
          type: string
          format: date-time
        signature:
          type: string

    ModelCapabilities:
      type: object
      required: [id, name, provider, maxResolution, maxDurationSeconds, supportedAspectRatios, supportedRegions, costPerSecondUsd, capabilities, defaultTimeoutSeconds]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        maxResolution:
          type: string
          enum: [720p, 1080p, 4K]
        maxDurationSeconds:
          type: integer
          minimum: 1
          maximum: 300
        supportedAspectRatios:
          type: array
          items:
            type: string
        supportedRegions:
          type: array
          items:
            type: string
        costPerSecondUsd:
          type: number
          minimum: 0
        costCurrency:
          type: string
          default: USD
        capabilities:
          type: array
          items:
            type: string
        defaultTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 600

    ShotRequirements:
      type: object
      properties:
        resolution:
          type: string
          enum: [720p, 1080p, 4K]
        aspectRatio:
          type: string
          enum: ['16:9', '9:16', '1:1', '4:5']
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 300
        region:
          type: string
        requiredCapabilities:
          type: array
          items:
            type: string
        modelOverride:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [healthy, degraded, unhealthy]
              latencyMs:
                type: integer
        metrics:
          type: object
          properties:
            activeStories:
              type: integer
            activeShots:
              type: integer
            costDriftPercentage:
              type: number

    PaginatedStories:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Story'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
