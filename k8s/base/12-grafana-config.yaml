apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fte-production
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: 'Prometheus'
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: '15s'
          queryTimeout: '60s'
          httpMethod: 'POST'
          manageAlerts: true
          alertmanagerUid: 'alertmanager'
      - name: 'Alertmanager'
        type: alertmanager
        access: proxy
        url: http://alertmanager:9093
        uid: 'alertmanager'
        editable: false
        jsonData:
          implementation: 'prometheus'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: fte-production
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'AI Video FTE Dashboards'
        orgId: 1
        folder: 'AI Video FTE'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: true