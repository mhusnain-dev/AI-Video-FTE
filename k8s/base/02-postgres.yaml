apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fte-production
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ai_video_fte
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-video-fte-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "ai_video_fte"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "ai_video_fte"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: migrations
          configMap:
            name: postgres-migrations
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fte-production
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-migrations
  namespace: fte-production
data:
  # Migrations will be added as files
  001_extensions.sql: "-- Extensions migration"
  002_core_tables.sql: "-- Core tables migration"
  003_admission_sacred.sql: "-- Admission/Sacred migration"
  004_events_cost_dispatch.sql: "-- Events/Cost/Dispatch migration"
  005_delivery_observability.sql: "-- Delivery/Observability migration"
  006_consumers.sql: "-- Consumers migration"
  007_alerts_audit_archives.sql: "-- Alerts/Audit/Archives migration"
  008_face_lock.sql: "-- Face-Lock migration"
  009_immutable_triggers.sql: "-- Immutable triggers migration"