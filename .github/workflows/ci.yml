name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/**/*.ts tests/**/*.ts --ext .ts

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: >-
          --cap-add IPC_LOCK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Vault transit engine
        run: |
          sleep 3
          curl -s -X POST \
            -H "X-Vault-Token: test-token" \
            -d '{"type":"transit"}' \
            http://localhost:8200/v1/sys/mounts/transit || true
          curl -s -X POST \
            -H "X-Vault-Token: test-token" \
            -d '{"type":"aes256-gcm96"}' \
            http://localhost:8200/v1/transit/keys/biometric-encryption || true
          curl -s -X POST \
            -H "X-Vault-Token: test-token" \
            -d '{}' \
            http://localhost:8200/v1/sys/mounts/transit/rotate || true

      - name: Initialize Postgres schema
        run: node migrations/run.js
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: fte_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSL: 'false'

      - name: Run tests
        run: npm test -- --testTimeout=30000 --testPathIgnorePatterns='tests/(integration|security)'
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: fte_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSL: 'false'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          VAULT_ADDRESS: http://localhost:8200
          VAULT_TOKEN: test-token
          VAULT_TRANSIT_KEY_NAME: fte-key
          VEO_WEBHOOK_SECRET: test-veo-secret
          RUNWAY_WEBHOOK_SECRET: test-runway-secret

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: >-
          --cap-add IPC_LOCK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Vault transit engine
        run: |
          sleep 3
          curl -s -X POST \
            -H "X-Vault-Token: test-token" \
            -d '{"type":"transit"}' \
            http://localhost:8200/v1/sys/mounts/transit || true
          curl -s -X POST \
            -H "X-Vault-Token: test-token" \
            -d '{"type":"aes256-gcm96"}' \
            http://localhost:8200/v1/transit/keys/biometric-encryption || true

      - name: Initialize Postgres schema
        run: node migrations/run.js
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: fte_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSL: 'false'

      - name: Run tests with coverage
        run: npm test -- --coverage --testTimeout=30000 --testPathIgnorePatterns='tests/(integration|security)'
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: fte_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SSL: 'false'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          VAULT_ADDRESS: http://localhost:8200
          VAULT_TOKEN: test-token
          VAULT_TRANSIT_KEY_NAME: fte-key
          VEO_WEBHOOK_SECRET: test-veo-secret
          RUNWAY_WEBHOOK_SECRET: test-runway-secret

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7