# AI Video FTE - Development Configuration
# Copy to config/development.yaml and customize

postgres:
  host: "localhost"
  port: 5433
  database: "ai_video_fte_dev"
  user: "postgres"
  password: "postgres"
  ssl: false
  poolSize: 20

redis:
  host: "localhost"
  port: 6380
  db: 0
  connectionPoolSize: 10

vault:
  address: "http://localhost:8201"
  token: "dev-root-token"
  transitKeyName: "biometric-encryption-dev"
  rotationIntervalDays: 90

storyIngestion:
  maxDecompositionTimeMs: 10000
  maxShotsPerStory: 100

modelRegistry:
  refreshIntervalMs: 300000
  models:
    - id: "kie-veo3-fast"
      name: "Kie.ai Veo 3.1 Fast"
      provider: "kie"
      maxResolution: "1080p"
      maxDurationSeconds: 8
      supportedAspectRatios: ["16:9", "9:16"]
      supportedRegions: ["global"]
      costPerSecondUsd: 0.01
      costCurrency: "USD"
      capabilities: ["text_to_video", "image_to_video", "reference_conditioning", "native_audio", "fast_generation"]
      defaultTimeoutSeconds: 300
    - id: "kie-veo3-quality"
      name: "Kie.ai Veo 3.1 Quality"
      provider: "kie"
      maxResolution: "4K"
      maxDurationSeconds: 8
      supportedAspectRatios: ["16:9", "9:16"]
      supportedRegions: ["global"]
      costPerSecondUsd: 0.04
      costCurrency: "USD"
      capabilities: ["text_to_video", "image_to_video", "reference_conditioning", "native_audio", "high_fidelity", "first_last_frame", "extend"]
      defaultTimeoutSeconds: 300
    - id: "kie-veo3-lite"
      name: "Kie.ai Veo 3.1 Lite"
      provider: "kie"
      maxResolution: "1080p"
      maxDurationSeconds: 8
      supportedAspectRatios: ["16:9", "9:16"]
      supportedRegions: ["global"]
      costPerSecondUsd: 0.005
      costCurrency: "USD"
      capabilities: ["text_to_video", "image_to_video", "reference_conditioning", "native_audio", "fast_generation"]
      defaultTimeoutSeconds: 300
    - id: "runway-gen3"
      name: "Runway Gen-3 Alpha"
      provider: "runway"
      maxResolution: "1080p"
      maxDurationSeconds: 10
      supportedAspectRatios: ["16:9", "9:16"]
      supportedRegions: ["us", "eu"]
      costPerSecondUsd: 0.08
      costCurrency: "USD"
      capabilities: ["text_to_video", "image_to_video", "reference_conditioning"]
      defaultTimeoutSeconds: 180
    - id: "luma-ray2"
      name: "Luma Ray 2"
      provider: "luma"
      maxResolution: "1080p"
      maxDurationSeconds: 10
      supportedAspectRatios: ["16:9", "9:16", "1:1"]
      supportedRegions: ["us"]
      costPerSecondUsd: 0.03
      costCurrency: "USD"
      capabilities: ["text_to_video", "image_to_video", "fast_generation"]
      defaultTimeoutSeconds: 120

router:
  systemDefaultPriority: ["runway-gen3", "kie-veo3-fast", "kie-veo3-quality", "kie-veo3-lite"]
  eligibilityCheckEnabled: true

admission:
  moderation:
    provider: "built-in"
    categories: ["violence", "sexual_content", "hate", "pii", "csam"]
    threshold: 0.8
  sacredGuard:
    visualSimilarityThreshold: 0.775
    perModelThresholds:
      kie-veo3-fast: 0.78
      kie-veo3-quality: 0.77
      kie-veo3-lite: 0.79
      runway-gen3: 0.79
      luma-ray2: 0.80
  costGuard:
    perModelEstimates:
      kie-veo3-fast: 0.01
      kie-veo3-quality: 0.04
      kie-veo3-lite: 0.005
      runway-gen3: 0.08
      luma-ray2: 0.03
    userBudgetUsd: 100.00
    projectCeilingUsd: 500.00
    committedSpendLimitUsd: 50.00
    singleShotDriftThreshold: 0.50
    rollingAverageDriftThreshold: 0.20
  rateLimit:
    perModel:
      kie-veo3-fast: 10
      kie-veo3-quality: 5
      kie-veo3-lite: 20
      runway-gen3: 5
      luma-ray2: 20
    perUser: 20
    global: 100
    perProjectOverrides: {}
  auditEnabled: true

dispatch:
  defaultTimeouts:
    kie-veo3-fast: 300
    kie-veo3-quality: 300
    kie-veo3-lite: 300
    runway-gen3: 180
    luma-ray2: 120
  watchdogPollIntervalMs: 30000
  watchdogMaxWaitMs: 600000
  maxFallbackAttempts: 3

faceLock:
  defaultPerModelThresholds:
    kie-veo3-fast: 0.82
    kie-veo3-quality: 0.80
    kie-veo3-lite: 0.78
    runway-gen3: 0.85
    luma-ray2: 0.78
  maxRetries: 2
  perModelCharacterThresholds: {}
  perModelCharacterRetries: {}

merger:
  defaultTransition:
    type: "crossfade"
    durationSeconds: 0.5
  ffmpegPath: "ffmpeg"
  supportedFormats: ["mp4"]
  maxMergeTimeMs: 300000

observability:
  metricsPort: 9090
  healthCheckIntervalMs: 30000
  auditRetentionYears: 7