# Alertmanager Production Configuration
# Routes alerts to appropriate receivers with inhibition rules

global:
  resolve_timeout: 5m
  # Configure SMTP for production alerts
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alerts@ai-video-fte.example.com'
  # smtp_auth_username: 'alerts@ai-video-fte.example.com'
  # smtp_auth_password_file: '/etc/alertmanager/smtp_password'
  # smtp_require_tls: true

# Inhibition rules to prevent notification storms
inhibit_rules:
  # Inhibit warnings if critical alert is firing for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']

  # Inhibit info if warning/critical firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['service', 'instance']

  # Inhibit SacredGuard block repeats
  - source_match:
      alertname: 'SacredGuardBlock'
    target_match_re:
      alertname: 'SacredGuardBlock'
    equal: ['model_id', 'user_id']

  # Inhibit cost drift warnings if critical cost alert firing
  - source_match:
      alertname: 'CostDriftCritical'
    target_match:
      alertname: 'CostDriftHigh'
    equal: ['story_id']

# Route tree
route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts - immediate PagerDuty
    - match:
        severity: 'critical'
      receiver: 'pagerduty-critical'
      continue: true
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 1h

    # Sacred Guard blocks - security team
    - match:
        alertname: 'SacredGuardBlock'
      receiver: 'security-team'
      continue: true
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m

    # Cost alerts - finance/engineering
    - match_re:
        alertname: 'CostDrift.*'
      receiver: 'cost-team'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 2h

    # Infrastructure alerts - platform team
    - match:
        team: 'platform'
      receiver: 'platform-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

    # Warning alerts - general engineering
    - match:
        severity: 'warning'
      receiver: 'engineering-warnings'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 4h

    # Info alerts - daily digest
    - match:
        severity: 'info'
      receiver: 'daily-digest'
      group_wait: 1h
      group_interval: 6h
      repeat_interval: 24h

    # Webhook/webhook alerts
    - match_re:
        alertname: 'Webhook.*'
      receiver: 'webhook-team'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 1h

# Receivers
receivers:
  # Default - Slack
  - name: 'default'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true
        icon_emoji: ':warning:'
        username: 'alertmanager'

  # Critical - PagerDuty
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key_file: '/etc/alertmanager/pagerduty_key'
        severity: 'critical'
        details:
          firing: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        client: 'AI Video FTE'
        client_url: 'https://grafana.example.com'

  # Security team for Sacred Guard
  - name: 'security-team'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-security'
        title: '🔒 Sacred Guard Alert: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Service**: {{ .Labels.service }}
          **Model**: {{ .Labels.model_id }}
          **User**: {{ .Labels.user_id }}
          **Enforcement Point**: {{ .Labels.enforcement_point }}
          **Reason**: {{ .Annotations.reason }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':lock:'
    pagerduty_configs:
      - service_key_file: '/etc/alertmanager/pagerduty_security_key'
        severity: 'critical'

  # Cost team
  - name: 'cost-team'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-costs'
        title: '💰 Cost Alert: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Story**: {{ .Labels.story_id }}
          **Model**: {{ .Labels.model_id }}
          **Drift**: {{ .Labels.drift_percentage }}%
          **Threshold**: {{ .Labels.threshold }}%
          **Estimated**: ${{ .Labels.estimated_cost }}
          **Actual**: ${{ .Labels.actual_cost }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':moneybag:'
    email_configs:
      - to: 'finance@example.com'
        send_resolved: true
        html: |
          <h2>Cost Alert: {{ .CommonLabels.alertname }}</h2>
          <table>
          {{ range .Alerts }}
            <tr><td>Story</td><td>{{ .Labels.story_id }}</td></tr>
            <tr><td>Model</td><td>{{ .Labels.model_id }}</td></tr>
            <tr><td>Drift</td><td>{{ .Labels.drift_percentage }}%</td></tr>
            <tr><td>Threshold</td><td>{{ .Labels.threshold }}%</td></tr>
            <tr><td>Estimated</td><td>${{ .Labels.estimated_cost }}</td></tr>
            <tr><td>Actual</td><td>${{ .Labels.actual_cost }}</td></tr>
          {{ end }}
          </table>

  # Platform team
  - name: 'platform-team'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-platform'
        title: '🖥️ Infrastructure Alert: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Service**: {{ .Labels.service }}
          **Instance**: {{ .Labels.instance }}
          **Severity**: {{ .Labels.severity }}
          **Description**: {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':computer:'
    pagerduty_configs:
      - service_key_file: '/etc/alertmanager/pagerduty_platform_key'
        severity: '{{ .CommonLabels.severity }}'

  # Engineering warnings
  - name: 'engineering-warnings'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-engineering'
        title: '⚠️ Warning: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Service**: {{ .Labels.service }}
          **Description**: {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':warning:'

  # Daily digest for info alerts
  - name: 'daily-digest'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-digest'
        title: '📊 Daily Info Digest - {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          • **{{ .Labels.alertname }}** ({{ .Labels.service }}): {{ .Annotations.description }}
          {{ end }}
        send_resolved: false
        icon_emoji: ':memo:'

  # Webhook team
  - name: 'webhook-team'
    slack_configs:
      - api_url_file: '/etc/alertmanager/slack_webhook'
        channel: '#fte-webhooks'
        title: '🔗 Webhook Alert: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Provider**: {{ .Labels.provider }}
          **Status**: {{ .Labels.status }}
          **Details**: {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':link:'
    webhook_configs:
      - url: 'https://webhook-handler.example.com/alerts'
        send_resolved: true

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'