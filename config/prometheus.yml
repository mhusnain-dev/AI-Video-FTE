global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fte-dev'
    environment: 'development'

scrape_configs:
  - job_name: 'fte-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'

  - job_name: 'fte-api-metrics'
    static_configs:
      - targets: ['api:9090']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'vault'
    static_configs:
      - targets: ['vault:8200']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
